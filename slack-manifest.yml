display_information:
  name: CustomerBot
  description: Triages and tracks customer-surfaced queries for Solutions Engineering
  background_color: "#24292f"

features:
  bot_user:
    display_name: customerbot
    always_online: true
  slash_commands:
    - command: /log-ticket
      url: https://prbot.fly.dev/slack/events
      description: Open a ticket-intake form
      usage_hint: ""
      should_escape: false
    - command: /csbot
      url: https://prbot.fly.dev/slack/events
      description: Legacy / admin (gated by CUSTOMERBOT_LEGACY_COMMANDS_ENABLED)
      usage_hint: "summary | close <id> | keyword … | settings"

oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:join
      - channels:read
      - chat:write
      - commands
      - groups:history
      - groups:read
      - im:history
      - im:write
      - mpim:history
      - reactions:read
      - reactions:write
      - usergroups:read
      - users:read

settings:
  event_subscriptions:
    request_url: https://prbot.fly.dev/slack/events
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: https://prbot.fly.dev/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
