app = "customerbot-userled"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  CUSTOMERBOT_HOST = "0.0.0.0"
  CUSTOMERBOT_PORT = "8080"
  CUSTOMERBOT_DATABASE_PATH = "/data/customerbot.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "customerbot_data"
  destination = "/data"
