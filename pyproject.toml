[project]
name = "prbot"
version = "0.1.0"
description = "Bot that reacts to GitHub PR URLs with status emojis across messaging integrations"
readme = "README.md"
authors = [
    { name = "Alexander Fedotov", email = "alexander.fedotov.uk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "cryptography>=46.0.5",
    "discord-py>=2.6.0",
    "fastapi>=0.129.0",
    "greenlet>=3.3.2",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "rich>=14.0.0",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.12.1",
    "slack-bolt>=1.27.0",
    "slack-sdk>=3.40.0",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.40.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
    "ruff>=0.15.1",
    "time-machine>=3.2.0",
    "ty>=0.0.17",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
