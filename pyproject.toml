[project]
name = "customerbot"
version = "0.1.0"
description = "Slack bot that tracks customer conversations and reminds Ryan to follow up"
readme = "README.md"
authors = [
    { name = "Alexander Fedotov", email = "alexander.fedotov.uk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi>=0.129.0",
    "greenlet>=3.3.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "slack-bolt>=1.27.0",
    "slack-sdk>=3.40.0",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.40.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
    "ruff>=0.15.1",
    "time-machine>=3.2.0",
    "ty>=0.0.17",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["customerbot", "tests"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "customerbot layered architecture"
type = "layers"
layers = [
    "customerbot.main",
    "customerbot.integration",
    "customerbot.data",
    "customerbot.application | customerbot.config",
    "customerbot.domain",
]

[[tool.importlinter.contracts]]
name = "tests mirror src layering"
type = "layers"
layers = [
    "tests.integration",
    "tests.data | tests.infrastructure",
    "tests.application",
    "tests.domain",
]

[[tool.importlinter.contracts]]
name = "domain and application are vendor-free"
type = "forbidden"
source_modules = [
    "customerbot.domain",
    "customerbot.application",
]
forbidden_modules = [
    "aiohttp",
    "aiosqlite",
    "alembic",
    "cryptography",
    "discord",
    "fastapi",
    "httpx",
    "pyjwt",
    "pydantic_settings",
    "rich",
    "slack_bolt",
    "slack_sdk",
    "sqlalchemy",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "tests do not import customerbot.main"
type = "forbidden"
source_modules = ["tests"]
forbidden_modules = ["customerbot.main"]

[[tool.importlinter.contracts]]
name = "test layer only imports matching src layer or lower"
type = "forbidden"
source_modules = ["tests.domain"]
forbidden_modules = [
    "customerbot.application",
    "customerbot.config",
    "customerbot.data",
    "customerbot.integration",
    "customerbot.main",
]

[[tool.importlinter.contracts]]
name = "tests.application does not reach into adapters or integration"
type = "forbidden"
source_modules = ["tests.application"]
forbidden_modules = [
    "customerbot.data",
    "customerbot.integration",
    "customerbot.main",
]

[[tool.importlinter.contracts]]
name = "tests.data does not reach into integration"
type = "forbidden"
source_modules = ["tests.data"]
forbidden_modules = [
    "customerbot.integration",
    "customerbot.main",
]

[[tool.importlinter.contracts]]
name = "tests.infrastructure does not reach into data or integration"
type = "forbidden"
source_modules = ["tests.infrastructure"]
forbidden_modules = [
    "customerbot.data",
    "customerbot.integration",
    "customerbot.main",
]
